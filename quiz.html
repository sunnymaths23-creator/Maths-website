<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Math Quiz | Simple Mathematics</title>

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#fffdf7;
      --ink:#151515;
      --muted:#55626f;

      --card: rgba(255,255,255,0.95);
      --stroke:#efe7d6;
      --shadow: 0 18px 50px rgba(40, 30, 10, 0.10);

      --yellow:#ffd166;
      --yellow2:#ffb703;

      --green:#2ecc71;
      --red:#ff4d4d;

      --rXL: 30px;
      --rL: 22px;
      --rM: 18px;

      --max: 980px;
    }

    *{ box-sizing:border-box; margin:0; padding:0; }
    body{
      font-family:"Manrope", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      overflow-x:hidden;
    }

    /* Background blobs */
    .bg{
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events:none;
      overflow:hidden;
    }
    .blob{
      position:absolute;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      filter: blur(55px);
      opacity: 0.42;
      animation: float 11s ease-in-out infinite;
    }
    .b1{
      background: radial-gradient(circle, rgba(255,209,102,0.85), transparent 60%);
      top:-220px; left:-160px;
    }
    .b2{
      background: radial-gradient(circle, rgba(46,204,113,0.55), transparent 60%);
      top:140px; right:-220px;
      animation-delay: 2.2s;
    }
    .b3{
      background: radial-gradient(circle, rgba(255,77,77,0.42), transparent 60%);
      bottom:-260px; left:250px;
      animation-delay: 3.7s;
    }
    @keyframes float{
      0%{ transform: translate(0,0) scale(1); }
      50%{ transform: translate(16px, 12px) scale(1.05); }
      100%{ transform: translate(0,0) scale(1); }
    }

    .nav{
      position: sticky;
      top:0;
      z-index:50;
      background: rgba(255,253,247,0.85);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(239,231,214,0.95);
    }

    .nav-inner{
      max-width: var(--max);
      margin:auto;
      padding: 14px 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand{
      display:flex;
      align-items:center;
      gap: 10px;
      font-weight: 900;
      letter-spacing: 0.2px;
      white-space: nowrap;
    }

    .logo{
      width: 46px;
      height: 46px;
      border-radius: 18px;
      display:grid;
      place-items:center;
      color: #111;
      font-weight: 900;
      background: linear-gradient(135deg, var(--yellow), var(--green), var(--red));
      box-shadow: 0 16px 26px rgba(0,0,0,0.10);
    }

    .nav a{
      text-decoration:none;
    }

    .nav-btn{
      padding: 10px 14px;
      border-radius: 999px;
      font-weight: 900;
      color: #161616;
      border: 1px solid rgba(239,231,214,0.95);
      background: linear-gradient(135deg, var(--yellow), #fff2c7);
      box-shadow: 0 14px 26px rgba(40,30,10,0.10);
      transition: 0.2s ease;
      white-space: nowrap;
    }
    .nav-btn:hover{ transform: translateY(-1px); filter: brightness(1.03); }

    .container{
      max-width: var(--max);
      margin:auto;
      padding: 18px;
      position: relative;
      z-index: 2;
    }

    .card{
      background: var(--card);
      border: 1px solid var(--stroke);
      border-radius: var(--rXL);
      box-shadow: var(--shadow);
      padding: 22px;
      margin-top: 16px;
    }

    h1{
      font-size: clamp(24px, 4vw, 38px);
      font-weight: 900;
      letter-spacing: -0.3px;
    }

    .sub{
      margin-top: 8px;
      color: var(--muted);
      line-height: 1.7;
      font-size: 15px;
    }

    .levels{
      margin-top: 14px;
      display:flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .level-btn{
      cursor:pointer;
      border: 1px solid rgba(239,231,214,0.95);
      padding: 12px 16px;
      border-radius: 999px;
      font-weight: 900;
      background: white;
      color: var(--ink);
      transition: 0.2s ease;
    }
    .level-btn:hover{
      transform: translateY(-2px);
      box-shadow: 0 16px 26px rgba(0,0,0,0.08);
    }
    .level-btn.active{
      border: none;
      background: linear-gradient(135deg, var(--green), var(--yellow2));
      color: #102015;
    }

    .quiz-box{
      margin-top: 18px;
      padding: 18px;
      border-radius: var(--rXL);
      border: 1px solid rgba(239,231,214,0.95);
      background: rgba(255,255,255,0.92);
    }

    .qhead{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .qno{
      font-weight: 900;
      color: #1a3b27;
      background: rgba(46,204,113,0.12);
      border: 1px solid rgba(46,204,113,0.18);
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 13px;
    }

    .question{
      font-size: 17px;
      font-weight: 900;
      line-height: 1.45;
    }

    .options{
      margin-top: 12px;
      display:grid;
      gap: 10px;
    }

    .opt{
      display:flex;
      gap: 10px;
      align-items:flex-start;
      padding: 12px 12px;
      border-radius: 18px;
      border: 1px solid rgba(239,231,214,0.95);
      background: white;
      cursor:pointer;
      transition: 0.18s ease;
      font-weight: 800;
    }
    .opt:hover{
      transform: translateY(-1px);
      background: rgba(255,244,210,0.95);
    }

    .opt input{
      margin-top: 2px;
      transform: scale(1.1);
      cursor:pointer;
    }

    .actions{
      margin-top: 14px;
      display:flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn{
      cursor:pointer;
      border: 1px solid rgba(239,231,214,0.95);
      padding: 12px 16px;
      border-radius: 16px;
      font-weight: 900;
      background: white;
      color: var(--ink);
      transition: 0.2s ease;
    }

    .btn:hover{
      transform: translateY(-2px);
      box-shadow: 0 16px 26px rgba(0,0,0,0.08);
    }

    .btn.main{
      border: none;
      background: linear-gradient(135deg, var(--red), var(--yellow2));
      color: #1a1a1a;
    }

    .msg{
      margin-top: 12px;
      font-weight: 900;
      color: var(--muted);
      line-height: 1.5;
    }

    .result{
      margin-top: 14px;
      padding: 14px;
      border-radius: 20px;
      border: 1px solid rgba(239,231,214,0.95);
      background: rgba(255,255,255,0.92);
      display:none;
    }

    .result.show{
      display:block;
    }

    .score{
      font-size: 20px;
      font-weight: 900;
      margin-bottom: 6px;
    }
.review-item{
  margin-top: 10px;
  padding: 14px;
  border-radius: 18px;
  border: 1px solid rgba(239,231,214,0.95);
  background: rgba(255,255,255,0.92);
}

.review-item.correct{
  border-left: 6px solid #2ecc71;
}

.review-item.wrong{
  border-left: 6px solid #ff4d4d;
}

.review-q{
  font-weight: 900;
  margin-bottom: 8px;
}

.review-a{
  color: #55626f;
  line-height: 1.6;
  font-weight: 800;
  margin-top: 4px;
}

    footer{
      margin-top: 26px;
      text-align:center;
      padding: 18px 0 32px;
      color: var(--muted);
      font-weight: 800;
      line-height: 1.7;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="bg" aria-hidden="true">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>

  <!-- NAV -->
  <div class="nav">
    <div class="nav-inner">
      <div class="brand">
        <div class="logo">∑</div>
        Simple Mathematics
      </div>
      <a class="nav-btn" href="index.html">⬅ Back to Home</a>
    </div>
  </div>

  <main class="container">
    <section class="card">
      <h1>📝 Mathematics Quiz (Beginner → Advanced)</h1>
      <p class="sub">
        Choose a level and start the quiz. At the end you will get your score instantly ✅
      </p>

      <div class="levels">
        <button class="level-btn active" id="btnBeginner" onclick="selectLevel('beginner')">Beginner</button>
        <button class="level-btn" id="btnIntermediate" onclick="selectLevel('intermediate')">Intermediate</button>
        <button class="level-btn" id="btnAdvanced" onclick="selectLevel('advanced')">Advanced</button>
      </div>

      <div class="quiz-box" id="quizBox">
        <!-- Question load here -->
      </div>

     <div class="result" id="resultBox">
  <div class="score" id="scoreText"></div>
  <div class="msg" id="resultMsg"></div>

  <!-- ✅ NEW: Answer Review List -->
  <div id="reviewList" style="margin-top:14px;"></div>

  <div class="actions">

          <button class="btn main" onclick="restartQuiz()">🔄 Restart Quiz</button>
          <a class="btn" href="index.html">🏠 Home</a>
        </div>
      </div>

    </section>

    <footer>
      © 2026 <b>Simple Mathematics</b> • Quizzes for Practice ✅
    </footer>
  </main>

  <script>
    // ======================
    // QUIZ DATA (3 LEVELS)
    // ======================

    const quizzes = {
      beginner: [
        { q: "Which of the following is an irrational number?", options: ["0.25", "5/2", "√2", "3"], ans: 2 },
        { q: "Which set contains all rational and irrational numbers?", options: ["Natural numbers", "Integers", "Real numbers", "Complex numbers"], ans: 2 },
        { q: "0 is:", options: ["Natural number", "Integer", "Irrational number", "Prime number"], ans: 1 },
        { q: "If A = {1,2,3}, number of subsets of A is:", options: ["3", "6", "8", "9"], ans: 2 },
        { q: "If A ⊂ B, then:", options: ["A ∪ B = A", "A ∩ B = A", "A ∩ B = B", "A ∪ B = ∅"], ans: 1 },
        { q: "If A = ∅, then n(A) =", options: ["0", "1", "∞", "-1"], ans: 0 },
        { q: "A function is a relation in which:", options: ["one input has many outputs", "one output has many inputs", "each input has exactly one output", "inputs are repeated"], ans: 2 },
        { q: "Domain of a function means:", options: ["set of outputs", "set of inputs", "range and codomain", "only codomain"], ans: 1 },
        { q: "f(x) = x² is:", options: ["one-one", "onto", "many-one", "constant"], ans: 2 },
        { q: "lim(x→2) (x+3) =", options: ["3", "4", "5", "6"], ans: 3 },
        { q: "If lim(x→a) f(x) = f(a), then f is:", options: ["discontinuous", "continuous at a", "periodic", "odd"], ans: 1 },
        { q: "A function is continuous at x=a if:", options: ["LHL exists only", "RHL exists only", "LHL = RHL = f(a)", "f(a) doesn’t exist"], ans: 2 },
        { q: "d/dx (x³) =", options: ["3x", "x²", "3x²", "x³"], ans: 2 },
        { q: "Derivative represents:", options: ["area under curve", "slope of tangent", "volume", "distance"], ans: 1 },
        { q: "d/dx (5) =", options: ["1", "5", "0", "x"], ans: 2 },
        { q: "∫ x dx =", options: ["x²", "x²/2 + C", "x + C", "2x + C"], ans: 1 },
        { q: "Integration is inverse process of:", options: ["factorization", "differentiation", "expansion", "simplification"], ans: 1 },
        { q: "∫ 1 dx =", options: ["1", "x", "x + C", "0"], ans: 2 },
        { q: "Maximum/Minimum problems are based on:", options: ["integration", "differentiation", "limits", "sets"], ans: 1 },
        { q: "If f'(x) > 0 for all x, function is:", options: ["decreasing", "constant", "increasing", "zero"], ans: 2 }
      ],

      intermediate: [
        { q: "lim(x→0) (sin x)/x =", options: ["0", "1", "∞", "-1"], ans: 1 },
        { q: "lim(x→0) (1 - cos x)/x² =", options: ["0", "1/2", "1", "2"], ans: 1 },
        { q: "Which one is removable discontinuity?", options: ["jump", "infinite", "hole", "oscillatory"], ans: 2 },
        { q: "If LHL ≠ RHL then discontinuity is:", options: ["removable", "jump", "infinite", "none"], ans: 1 },
        { q: "f(x) = |x| is:", options: ["differentiable at 0", "not differentiable at 0", "differentiable everywhere", "continuous nowhere"], ans: 1 },
        { q: "d/dx (sin x) =", options: ["cos x", "-cos x", "sin x", "-sin x"], ans: 0 },
        { q: "d/dx (cos x) =", options: ["cos x", "-sin x", "sin x", "-cos x"], ans: 1 },
        { q: "Product rule is:", options: ["(uv)' = u'v + uv'", "(uv)' = u'v'", "(uv)' = u + v", "none"], ans: 0 },
        { q: "Quotient rule is:", options: ["(u/v)'=(u'v-uv')/v²", "(u/v)'=(u'v+uv')/v²", "(u/v)'=u'/v'", "none"], ans: 0 },
        { q: "d/dx (x² sin x) =", options: ["2x sin x + x² cos x", "2x cos x + x² sin x", "x² cos x", "2x sin x"], ans: 0 },
        { q: "d/dx (x²/(x+1)) =", options: ["x²/(x+1)²", "((2x)(x+1)-x²)/ (x+1)²", "2x/(x+1)", "(x+1)/x²"], ans: 1 },
        { q: "∫ cos x dx =", options: ["sin x + C", "-sin x + C", "cos x + C", "-cos x + C"], ans: 0 },
        { q: "∫ sin x dx =", options: ["cos x + C", "-cos x + C", "sin x + C", "none"], ans: 1 },
        { q: "∫ e^x dx =", options: ["x e^x", "e^x + C", "ln x", "1/e^x"], ans: 1 },
        { q: "∫ 1/x dx =", options: ["x", "ln|x| + C", "1/x", "x²"], ans: 1 },
        { q: "If u = x² + 1, then du =", options: ["dx", "2x dx", "x dx", "2 dx"], ans: 1 },
        { q: "∫ 2x(x²+1)^5 dx =", options: ["(x²+1)^5 + C", "(x²+1)^6/6 + C", "(x²+1)^6 + C", "none"], ans: 1 },
        { q: "∫ x e^x dx =", options: ["x e^x - e^x + C", "x e^x + e^x + C", "e^x + C", "x² e^x + C"], ans: 0 },
        { q: "∫ 1/(x²+1) dx =", options: ["tan⁻¹x + C", "ln|x| + C", "sin⁻¹x + C", "1/(x+1)"], ans: 0 },
        { q: "If f'(a)=0 and f''(a)<0, then point is:", options: ["minimum", "maximum", "inflection", "none"], ans: 1 }
      ],

      advanced: [
        { q: "lim(x→0) (tan x - x)/x³ =", options: ["0", "1/3", "1", "∞"], ans: 1 },
        { q: "If a function has jump discontinuity at x=a, then:", options: ["LHL = RHL", "LHL and RHL exist but not equal", "limit does not exist due to ∞", "f(a) must be undefined"], ans: 1 },
        { q: "f(x)=x² for x≠1 and f(1)=3 is continuous at x=1 if value at 1 should be:", options: ["1", "2", "3", "4"], ans: 0 },
        { q: "Derivative by first principle of f(x)=x² is:", options: ["x", "2x", "x²", "2"], ans: 1 },
        { q: "If f(x)=ln x, then f'(x) =", options: ["1/x", "x", "ln x", "x ln x"], ans: 0 },
        { q: "If y=x^x then dy/dx =", options: ["x^(x-1)", "x^x(1+ln x)", "x^x(ln x)", "none"], ans: 1 },
        { q: "If y=sin⁻¹x then dy/dx =", options: ["1/√(1+x²)", "1/√(1-x²)", "√(1-x²)", "none"], ans: 1 },
        { q: "Geometrically f'(a) represents:", options: ["y-intercept", "slope of tangent at x=a", "area", "radius"], ans: 1 },
        { q: "d/dx (tan x) =", options: ["sec²x", "csc²x", "sec x", "cos²x"], ans: 0 },
        { q: "∫ 1/(x√(x²-1)) dx =", options: ["sec⁻¹x + C", "tan⁻¹x + C", "ln|x| + C", "sin⁻¹x + C"], ans: 0 },
        { q: "∫ ln x dx =", options: ["x ln x - x + C", "ln x + C", "x + C", "none"], ans: 0 },
        { q: "∫ x/(x²+1) dx =", options: ["ln(x²+1)+C", "1/2 ln(x²+1)+C", "x²+1+C", "none"], ans: 1 },
        { q: "∫ 1/(x²-1) dx =", options: ["1/2 ln|(x-1)/(x+1)| + C", "ln|x²-1| + C", "tan⁻¹x + C", "none"], ans: 0 },
        { q: "∫ (3x+2)/(x²+x) dx equals:", options: ["∫(1/x + 2/(x+1))dx", "∫(2/x + 1/(x+1))dx", "∫(3/x + 2/(x+1))dx", "none"], ans: 1 },
        { q: "If f'(x)=0 for all x in interval, then f is:", options: ["increasing", "decreasing", "constant", "periodic"], ans: 2 },
        { q: "If f''(a)=0 and sign of f'' changes at a, point is:", options: ["maxima", "minima", "inflection point", "discontinuity"], ans: 2 },
        { q: "For f(x)=x³-3x, critical points are:", options: ["x=0", "x=±1", "x=±3", "none"], ans: 1 },
        { q: "∫ 1/(x+1)² dx =", options: ["ln|x+1|+C", "-1/(x+1)+C", "1/(x+1)+C", "(x+1)+C"], ans: 1 },
        { q: "∫ sec²x dx =", options: ["tan x + C", "sec x + C", "sin x + C", "cos x + C"], ans: 0 },
        { q: "Condition for local maximum at x=a is:", options: ["f'(a)=0,f''(a)>0", "f'(a)=0,f''(a)<0", "f'(a)>0", "f''(a)=0 only"], ans: 1 }
      ]
    };

    // ======================
    // QUIZ ENGINE
    // ======================
    let level = "beginner";
    let index = 0;
    let answers = []; // store selected option index

    function selectLevel(lvl){
      level = lvl;
      index = 0;
      answers = [];

      document.getElementById("btnBeginner").classList.remove("active");
      document.getElementById("btnIntermediate").classList.remove("active");
      document.getElementById("btnAdvanced").classList.remove("active");

      if(lvl === "beginner") document.getElementById("btnBeginner").classList.add("active");
      if(lvl === "intermediate") document.getElementById("btnIntermediate").classList.add("active");
      if(lvl === "advanced") document.getElementById("btnAdvanced").classList.add("active");

      document.getElementById("resultBox").classList.remove("show");
      document.getElementById("quizBox").style.display = "block";

      renderQuestion();
    }

    function renderQuestion(){
      const data = quizzes[level];
      const q = data[index];

      const total = data.length;
      const saved = answers[index];

      let html = `
        <div class="qhead">
          <div class="qno">Question ${index+1} / ${total}</div>
        </div>
        <div class="question">${q.q}</div>
        <div class="options">
      `;

      q.options.forEach((opt, i)=>{
        const checked = (saved === i) ? "checked" : "";
        html += `
          <label class="opt">
            <input type="radio" name="opt" value="${i}" ${checked} onchange="saveAnswer(${i})" />
            <span>${String.fromCharCode(65+i)}. ${opt}</span>
          </label>
        `;
      });

      html += `</div>`;

      html += `
        <div class="actions">
          <button class="btn" onclick="prevQuestion()" ${index===0 ? "disabled" : ""}>⬅ Previous</button>
          ${index < total-1
            ? `<button class="btn main" onclick="nextQuestion()">Next ➡</button>`
            : `<button class="btn main" onclick="finishQuiz()">✅ Submit</button>`
          }
        </div>
        <div class="msg">Tip: Select an option to save your answer automatically.</div>
      `;

      document.getElementById("quizBox").innerHTML = html;
    }

    function saveAnswer(i){
      answers[index] = i;
    }

    function nextQuestion(){
      const data = quizzes[level];
      if(index < data.length - 1){
        index++;
        renderQuestion();
      }
    }

    function prevQuestion(){
      if(index > 0){
        index--;
        renderQuestion();
      }
    }

   function finishQuiz(){
  const data = quizzes[level];
  let score = 0;

  // Calculate score
  data.forEach((item, i)=>{
    if(answers[i] === item.ans) score++;
  });

  document.getElementById("quizBox").style.display = "none";
  document.getElementById("resultBox").classList.add("show");

  document.getElementById("scoreText").innerText =
    `Your Score: ${score} / ${data.length}`;

  let msg = "";
  const percent = Math.round((score/data.length)*100);

  if(percent >= 85) msg = "Excellent ✅ Keep it up!";
  else if(percent >= 60) msg = "Good 👍 Practice a little more!";
  else msg = "Keep practicing 💪 You will improve fast!";

  document.getElementById("resultMsg").innerText =
    `Performance: ${percent}% • ${msg}`;

  // ✅ NEW: Generate Answer Review List
  let reviewHTML = `<h3 style="margin-top:10px; font-weight:900;">📌 Answer Review</h3>`;

  data.forEach((item, i)=>{
    const userAnsIndex = answers[i];
    const correctIndex = item.ans;

    const userAnsText =
      (userAnsIndex === undefined)
        ? "Not Answered"
        : item.options[userAnsIndex];

    const correctText = item.options[correctIndex];

    const isCorrect = (userAnsIndex === correctIndex);

    reviewHTML += `
      <div class="review-item ${isCorrect ? "correct" : "wrong"}">
        <div class="review-q">
          Q${i+1}. ${item.q} ${isCorrect ? "✅" : "❌"}
        </div>
        <div class="review-a"><b>Your Answer:</b> ${userAnsText}</div>
        <div class="review-a"><b>Correct Answer:</b> ${correctText}</div>
      </div>
    `;
  });

  document.getElementById("reviewList").innerHTML = reviewHTML;
}


  function restartQuiz(){
  index = 0;
  answers = [];
  document.getElementById("reviewList").innerHTML = ""; // ✅ clear review
  document.getElementById("resultBox").classList.remove("show");
  document.getElementById("quizBox").style.display = "block";
  renderQuestion();
}

    // Load default
    renderQuestion();
  </script>

</body>
</html>
